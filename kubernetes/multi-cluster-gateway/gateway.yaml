apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: request-info-global
  namespace: assessment-apps
spec:
  gatewayClassName: gke-l7-global-external-managed-mc
  addresses:
    - type: NamedAddress
      value: gke-sre-assessment-gateway-ip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: gke-sre-assessment.duckdns.org
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        options:
          networking.gke.io/pre-shared-certs: gke-sre-assessment-gateway-cert
      allowedRoutes:
        namespaces:
          from: Same
